name: Build AL-QUWIYYI EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java Files
        shell: pwsh
        run: |
          cd desktop
          javac -d . *.java

      - name: Create JAR
        shell: pwsh
        run: |
          cd desktop
          jar cvfe AL-QUWIYYI.jar LoginFrame *.class
          New-Item -ItemType Directory -Force -Path "lib"
          Move-Item -Force AL-QUWIYYI.jar lib\

      - name: Build EXE with jpackage
        shell: pwsh
        run: |
          $iconPath = "desktop\icons\hgd.ico"
          if (Test-Path $iconPath) {
            jpackage `
              --type exe `
              --dest dist `
              --input desktop\lib `
              --main-jar AL-QUWIYYI.jar `
              --main-class LoginFrame `
              --name "AL-QUWIYYI" `
              --icon $iconPath `
              --win-shortcut `
              --win-menu `
              --vendor "AL-QUWIYYI" `
              --app-version "1.0.0"
          } else {
            jpackage `
              --type exe `
              --dest dist `
              --input desktop\lib `
              --main-jar AL-QUWIYYI.jar `
              --main-class LoginFrame `
              --name "AL-QUWIYYI" `
              --win-shortcut `
              --win-menu `
              --vendor "AL-QUWIYYI" `
              --app-version "1.0.0"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AL-QUWIYYI-Setup
          path: dist/*.exe
          retention-days: 30
